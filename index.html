<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Logsuzlar Service</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  font-family:'Inter',sans-serif;background:#060606;color:#e8e8e8;line-height:1.5;
  min-height:100vh;overflow-x:hidden;position:relative;-webkit-font-smoothing:antialiased;
  perspective:1400px;
}
body::before{
  content:"";position:fixed;inset:-50%;
  background:
    radial-gradient(circle at 20% 30%,rgba(120,80,255,.08),transparent 40%),
    radial-gradient(circle at 80% 70%,rgba(0,200,255,.06),transparent 40%),
    radial-gradient(circle at 50% 50%,rgba(255,80,180,.05),transparent 50%);
  animation:bgFloat 20s ease-in-out infinite alternate;pointer-events:none;z-index:0;
  will-change:transform;transform:translateZ(-100px) scale(1.1);
}
@keyframes bgFloat{0%{transform:translate3d(0,0,0) scale(1.1)}100%{transform:translate3d(2%,-2%,0) scale(1.15)}}
::-webkit-scrollbar{width:5px}
::-webkit-scrollbar-track{background:#0a0a0a}
::-webkit-scrollbar-thumb{background:linear-gradient(180deg,#333,#111);border-radius:3px}

.container{max-width:900px;margin:0 auto;padding:20px 14px;position:relative;z-index:1;transform-style:preserve-3d}

.header{
  margin-bottom:20px;padding-bottom:14px;border-bottom:1px solid #141414;
  display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;
  animation:fadeDown .7s cubic-bezier(.22,1,.36,1) both;transform-style:preserve-3d;
}
@keyframes fadeDown{from{opacity:0;transform:translateY(-15px) rotateX(-10deg)}to{opacity:1;transform:translateY(0) rotateX(0)}}
.header h1{
  font-size:1.2rem;font-weight:700;color:#fff;letter-spacing:-.3px;
  background:linear-gradient(90deg,#fff 0%,#aaa 50%,#fff 100%);background-size:200% auto;
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
  animation:shine 4s linear infinite;
}
@keyframes shine{to{background-position:200% center}}
.header-right{display:flex;align-items:center;gap:8px}
.badge-version{padding:2px 8px;background:#101010;border:1px solid #1a1a1a;border-radius:10px;font-size:.55rem;color:#555;letter-spacing:.5px;font-weight:500;transition:all .3s}
.badge-version:hover{border-color:#444;color:#aaa;transform:translateY(-2px) translateZ(10px)}
.status-dot{display:flex;align-items:center;gap:5px;font-size:.6rem;color:#555}
.status-dot .dot{width:5px;height:5px;border-radius:50%;background:#22c55e;box-shadow:0 0 0 0 rgba(34,197,94,.7);animation:pulseDot 2s infinite}
@keyframes pulseDot{0%{box-shadow:0 0 0 0 rgba(34,197,94,.7)}70%{box-shadow:0 0 0 6px rgba(34,197,94,0)}100%{box-shadow:0 0 0 0 rgba(34,197,94,0)}}
.status-text.online{color:#22c55e}

.api-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px;margin-bottom:24px;perspective:1200px;transform-style:preserve-3d}

.api-card{
  background:linear-gradient(145deg,#0d0d0d,#0a0a0a);border:1px solid #161616;border-radius:10px;
  padding:12px 14px;position:relative;overflow:hidden;transform-style:preserve-3d;
  transition:transform .5s cubic-bezier(.22,1,.36,1),border-color .4s,box-shadow .5s;
  will-change:transform;animation:cardIn .6s cubic-bezier(.22,1,.36,1) both;
  box-shadow:0 8px 20px -10px rgba(0,0,0,.8);
}
@keyframes cardIn{from{opacity:0;transform:translateY(20px) rotateX(-12deg) scale(.96)}to{opacity:1;transform:translateY(0) rotateX(0) scale(1)}}
.api-card::before{content:"";position:absolute;inset:0;background:radial-gradient(400px circle at var(--mx,50%) var(--my,50%),rgba(122,92,255,.1),transparent 40%);opacity:0;transition:opacity .4s;pointer-events:none}
.api-card:hover::before{opacity:1}
.api-card:hover{transform:translateY(-5px) rotateX(3deg) rotateY(-3deg) scale(1.01);border-color:#3a3a3a;box-shadow:0 20px 40px -15px rgba(122,92,255,.25),0 10px 20px -8px rgba(0,0,0,.9)}

.card-header{display:flex;align-items:center;gap:8px;margin-bottom:8px;position:relative;z-index:1}
.card-icon{width:28px;height:28px;display:flex;align-items:center;justify-content:center;background:linear-gradient(145deg,#181818,#0a0a0a);border-radius:7px;color:#aaa;font-size:.7rem;flex-shrink:0;border:1px solid #1a1a1a;transition:transform .5s cubic-bezier(.22,1,.36,1),color .4s,border-color .4s}
.api-card:hover .card-icon{color:#fff;border-color:#7a5cff;transform:rotate(-8deg) scale(1.1) translateZ(15px);box-shadow:0 8px 15px -3px rgba(122,92,255,.4)}
.card-header h3{font-size:.7rem;font-weight:600;color:#e0e0e0;letter-spacing:-.1px;transition:color .3s}
.api-card:hover .card-header h3{color:#fff}
.card-header .badge{padding:2px 7px;background:#101010;border:1px solid #1a1a1a;border-radius:8px;font-size:.4rem;font-weight:700;color:#555;text-transform:uppercase;letter-spacing:.5px;margin-left:auto}
.card-header .badge.pro{color:#a78bfa;border-color:#2a2050}
.card-header .badge.free{color:#22c55e;border-color:#1a2a1a}

.api-url{font-family:'Menlo','Monaco','Consolas',monospace;font-size:.5rem;color:#777;background:#060606;padding:6px 8px;border-radius:6px;border:1px solid #121212;margin-bottom:8px;word-break:break-all;line-height:1.5;position:relative;z-index:1;transition:border-color .4s,color .4s}
.api-card:hover .api-url{border-color:#2a2a2a;color:#aaa}

.card-actions{display:flex;gap:6px;position:relative;z-index:1}
.btn{padding:6px 10px;border-radius:6px;font-size:.6rem;font-weight:600;text-decoration:none;display:flex;align-items:center;justify-content:center;gap:5px;cursor:pointer;border:none;font-family:'Inter',sans-serif;flex:1;position:relative;transition:all .3s cubic-bezier(.22,1,.36,1);box-shadow:0 4px 10px -3px rgba(0,0,0,.8);overflow:hidden}
.btn::before{content:"";position:absolute;top:0;left:-100%;width:100%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.3),transparent);transition:left .6s}
.btn:hover::before{left:100%}
.btn-primary{background:linear-gradient(135deg,#fff,#dcdcdc);color:#000}
.btn-primary:hover{transform:translateY(-3px) translateZ(12px) rotateX(6deg);box-shadow:0 12px 25px -8px rgba(255,255,255,.5)}
.btn-primary:active{transform:translateY(1px) scale(.95);transition:all .1s}
.btn-secondary{background:transparent;color:#888;border:1px solid #1f1f1f}
.btn-secondary:hover{background:#141414;border-color:#3a3a3a;color:#fff;transform:translateY(-3px) translateZ(12px) rotateX(6deg)}
.btn-secondary:active{transform:translateY(1px) scale(.95);transition:all .1s}

.info-box{background:linear-gradient(145deg,#0d0d0d,#0a0a0a);border:1px solid #161616;border-radius:10px;padding:14px 16px;margin-bottom:18px;display:flex;align-items:flex-start;gap:10px;transition:border-color .4s,transform .4s;box-shadow:0 8px 20px -10px rgba(0,0,0,.8)}
.info-box:hover{border-color:#2a2a2a;transform:translateY(-4px) translateZ(10px)}
.info-box i{color:#7a5cff;font-size:.9rem;margin-top:2px;animation:spinSlow 8s linear infinite}
@keyframes spinSlow{to{transform:rotate(360deg)}}
.info-box-content h4{color:#e0e0e0;font-size:.7rem;font-weight:600;margin-bottom:2px}
.info-box-content p{color:#555;font-size:.65rem;line-height:1.5}
.info-box-content p strong{color:#a78bfa;font-weight:600}

.contact-section{background:linear-gradient(145deg,#0d0d0d,#0a0a0a);border:1px solid #161616;border-radius:10px;padding:16px 18px;text-align:center;transition:border-color .4s,transform .4s;box-shadow:0 8px 20px -10px rgba(0,0,0,.8)}
.contact-section:hover{border-color:#222;transform:translateY(-3px) translateZ(10px)}
.contact-title{color:#e0e0e0;font-size:.7rem;font-weight:600;margin-bottom:10px}
.contact-buttons{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.contact-btn{padding:7px 14px;background:transparent;border:1px solid #1f1f1f;border-radius:8px;color:#aaa;text-decoration:none;font-size:.65rem;display:flex;align-items:center;gap:6px;transition:all .3s}
.contact-btn:hover{border-color:#7a5cff;background:rgba(122,92,255,.08);color:#fff;transform:translateY(-3px) translateZ(15px)}
.contact-btn i{font-size:.7rem;color:#555;transition:color .3s}
.contact-btn:hover i{color:#a78bfa}

.loading-text{color:#555;font-size:.7rem;text-align:center;padding:20px;grid-column:1/-1}
.loading-text i{animation:spinSlow 1s linear infinite;margin-right:6px}

@media (max-width:768px){
  .container{padding:16px 12px}
  .header h1{font-size:1.1rem}
  .api-grid{grid-template-columns:1fr;gap:10px}
  .contact-buttons{flex-direction:row;justify-content:center}
  .contact-btn{flex:1;justify-content:center;font-size:.6rem;padding:7px 10px}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<div class="container">

  <div class="header">
    <div class="header-left">
      <h1>Logsuzlar Service</h1>
    </div>
    <div class="header-right">
      <span class="badge-version">v1.0</span>
      <div class="status-dot">
        <span class="dot online"></span>
        <span class="status-text online"> Online </span>
      </div>
    </div>
  </div>

  <!-- API LİSTESİ OTOMATİK OLUŞACAK -->
  <div class="api-grid" id="apiGrid">
    <div class="loading-text"><i class="fas fa-spinner"></i> API listesi yükleniyor...</div>
  </div>

  <div class="info-box">
    <i class="fas fa-info-circle"></i>
    <div class="info-box-content">
      <h4>Bilgi</h4>
      <p>Tüm API'ler <strong>ücretsizdir</strong>. Ücret talep edenlere itibar etmeyin. Sorgulamalar size aittir. <strong>@fbxnext</strong></p>
    </div>
  </div>

  <div class="contact-section">
    <div class="contact-title">İletişim &amp; Topluluk</div>
    <div class="contact-buttons">
      <a href="https://t.me/fbxnext" class="contact-btn" target="_blank"><i class="fab fa-telegram"></i> @fbxnext</a>
      <a href="https://t.me/logsuzlarvip" class="contact-btn" target="_blank"><i class="fab fa-telegram"></i> @logsuzlarvip</a>
      <a href="https://t.me/izsinopya" class="contact-btn" target="_blank"><i class="fab fa-telegram"></i> @izsinopya</a>
    </div>
  </div>

</div>

<script>
/* ============================================
   API LİSTESİNİ OTOMATİK ÇEK VE KARTLARI OLUŞTUR
============================================ */
(async function () {
  const grid = document.getElementById("apiGrid");

  try {
    // Sitenin kendi domaininden listeyi çek
    const res = await fetch("/api/sorgu?api=list");
    const json = await res.json();

    if (!json.success || !json.apis) {
      grid.innerHTML = '<div class="loading-text">API listesi alınamadı.</div>';
      return;
    }

    grid.innerHTML = "";

    json.apis.forEach((api, i) => {
      const card = document.createElement("div");
      card.className = "api-card";
      card.style.animationDelay = (i * 0.03) + "s";

      card.innerHTML = `
        <div class="card-header">
          <div class="card-icon"><i class="fas ${api.icon}"></i></div>
          <h3>${api.name}</h3>
          <span class="badge ${api.badge}">${api.badge === "pro" ? "pro" : "ücretsiz"}</span>
        </div>
        <div class="api-url">${api.demoUrl}</div>
        <div class="card-actions">
          <a href="${api.demoUrl}" target="_blank" class="btn btn-primary"><i class="fas fa-arrow-right"></i> Git</a>
          <button class="btn btn-secondary" data-url="${api.demoUrl}"><i class="fas fa-copy"></i> Kopyala</button>
        </div>
      `;
      grid.appendChild(card);
    });

    // 3D mouse takip
    document.querySelectorAll(".api-card").forEach(card => {
      card.addEventListener("mousemove", e => {
        const r = card.getBoundingClientRect();
        card.style.setProperty("--mx", ((e.clientX - r.left) / r.width) * 100 + "%");
        card.style.setProperty("--my", ((e.clientY - r.top) / r.height) * 100 + "%");
      });
    });

    // Kopyalama butonları
    document.querySelectorAll(".btn-secondary[data-url]").forEach(btn => {
      btn.addEventListener("click", function () {
        const url = this.dataset.url;
        const original = this.innerHTML;

        const success = () => {
          this.innerHTML = '<i class="fas fa-check"></i> Kopyalandı!';
          this.style.background = "#fff";
          this.style.color = "#000";
          this.style.borderColor = "#fff";
          setTimeout(() => {
            this.innerHTML = original;
            this.style.background = "transparent";
            this.style.color = "#888";
            this.style.borderColor = "#1f1f1f";
          }, 1500);
        };

        const error = () => {
          this.innerHTML = '<i class="fas fa-times"></i> Hata!';
          setTimeout(() => { this.innerHTML = original; }, 1500);
        };

        if (navigator.clipboard && window.isSecureContext) {
          navigator.clipboard.writeText(url).then(success).catch(() => {
            fallbackCopy(url) ? success() : error();
          });
        } else {
          fallbackCopy(url) ? success() : error();
        }
      });
    });

  } catch (e) {
    grid.innerHTML = '<div class="loading-text">Bağlantı hatası: ' + e.message + '</div>';
  }

  function fallbackCopy(text) {
    const ta = document.createElement("textarea");
    ta.value = text;
    ta.style.position = "fixed";
    ta.style.left = "-999999px";
    document.body.appendChild(ta);
    ta.focus();
    ta.select();
    let ok = false;
    try { ok = document.execCommand("copy"); } catch { ok = false; }
    document.body.removeChild(ta);
    return ok;
  }
})();
</script>
</body>
</html>
